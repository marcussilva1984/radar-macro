name: Ingest YouTube 4x/day (Telegram alerts)

on:
  schedule:
    # A cada 6h (04h/10h/16h/22h BRT) — mais frequente que 3x/dia sem estourar a cota
    # gratuita da YouTube Data API (10.000 unidades/dia; cada rodada gasta ~1.800 com 938
    # canais + buscas por tema, então de hora em hora estouraria rápido). Vercel Hobby só
    # permite cron nativo 1x/dia, por isso GitHub Actions aqui.
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest-youtube endpoint
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://radar-macro.vercel.app/api/cron/ingest-youtube"
