name: Ingest YouTube 3x/day (Telegram alerts)

on:
  schedule:
    # 09:00, 15:00, 21:00 horário de Brasília (UTC-3) — manhã, tarde, noite, cobrindo lives
    # em horários diferentes. Vercel Hobby só permite cron 1x/dia, por isso GitHub Actions.
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest-youtube endpoint
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://radar-macro.vercel.app/api/cron/ingest-youtube"
