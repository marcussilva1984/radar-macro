name: Ingest YouTube (subscriptions 8x/day + discover 2x/day)

on:
  schedule:
    # Canais que você segue — barato em cota (~980 unid/rodada), 8x/dia (a cada 3h).
    - cron: "0 4 * * *"
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch: {}

jobs:
  subscriptions:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest-youtube endpoint (subscriptions)
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://radar-macro.vercel.app/api/cron/ingest-youtube"
