name: Ingest YouTube discover (1x/day)

on:
  schedule:
    # Descoberta por tema (canais que você não segue) — caro em cota (~1300 unid/rodada com
    # 13 tópicos incluindo cripto/altcoins); 1x/dia pra não estourar os 10k/dia junto com o
    # cron de subscriptions (8x/dia, ~980 unid cada = ~7840/dia).
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Call ingest-youtube-discover endpoint
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://radar-macro.vercel.app/api/cron/ingest-youtube-discover"
